services:
  - type: web
    name: tour-app
    runtime: docker
    plan: starter
    region: singapore
    
    buildCommand: docker build -t tour-app .
    
    envVars:
      - key: APP_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://tour-website-qwbk.onrender.com
      - key: ASSET_URL
        value: https://tour-website-qwbk.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: ballast.proxy.rlwy.net
      - key: DB_PORT
        value: "21833"
      - key: DB_DATABASE
        value: railway
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        sync: false
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database
#     user: tour_user
#     ipAllowList: [] # Allow all IPs
