services:
  - type: web
    name: tour-app
    runtime: docker
    plan: starter
    region: singapore
    
    buildCommand: docker build -t tour-app .
    
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
        # Add your database credentials below
      # - key: DB_HOST
      #   fromDatabase:
      #     name: mysql-db
      #     property: host
      # - key: DB_PORT
      #   fromDatabase:
      #     name: mysql-db
      #     property: port
      # - key: DB_DATABASE
      #   fromDatabase:
      #     name: mysql-db
      #     property: database
      # - key: DB_USERNAME
      #   fromDatabase:
      #     name: mysql-db
      #     property: username
      # - key: DB_PASSWORD
      #   fromDatabase:
      #     name: mysql-db
      #     property: password
      - key: CACHE_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_DRIVER
        value: database

# Optional: MySQL Database
# databases:
#   - name: mysql-db
#     databaseName: tour_app
#     user: tour_user
#     ipAllowList: [] # Allow all IPs
